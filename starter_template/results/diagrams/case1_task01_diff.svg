<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="drugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="matchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="missGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
    <linearGradient id="neutralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <marker id="arrowMatch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowMiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
    <marker id="arrowNeutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bc8cff"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="45" fill="#f0f6fc" font-size="20" font-weight="700">Case 1: Dual Elimination Clearance Blockade (TASK-01)</text>
  <text x="40" y="70" fill="#8b949e" font-size="13">Rivaroxaban + Ketoconazole in Moderate Renal Impairment (CrCl 41 mL/min) — Edge Diff Analysis</text>

  <!-- Legend -->
  <g transform="translate(540, 30)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#2ea043"/>
    <text x="24" y="13" fill="#c9d1d9" font-size="11" font-weight="600">Matched Mandatory Edge</text>
    <rect x="180" y="0" width="16" height="16" rx="4" fill="#f85149"/>
    <text x="204" y="13" fill="#c9d1d9" font-size="11" font-weight="600">Missed Causal Hop</text>
    <rect x="0" y="24" width="16" height="16" rx="4" fill="#a371f7"/>
    <text x="24" y="37" fill="#c9d1d9" font-size="11" font-weight="600">Neutral Edge (Valid Biology)</text>
  </g>

  <!-- Nodes -->
  <!-- Drug 1: Ketoconazole -->
  <rect x="50" y="200" width="160" height="60" rx="8" fill="url(#drugGrad)" stroke="#58a6ff" stroke-width="2"/>
  <text x="130" y="235" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">KETOCONAZOLE</text>
  <text x="130" y="250" fill="#c9d1d9" font-size="10" text-anchor="middle">Offending Dual Inhibitor</text>

  <!-- Intermediates -->
  <!-- CYP3A4 (Matched) -->
  <rect x="360" y="120" width="160" height="55" rx="8" fill="url(#matchGrad)" stroke="#3fb950" stroke-width="2"/>
  <text x="440" y="152" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">CYP3A4</text>
  <text x="440" y="167" fill="#dcffe4" font-size="10" text-anchor="middle">Hepatic Clearance (~67%)</text>

  <!-- P-gp (Missed hop) -->
  <rect x="360" y="220" width="160" height="55" rx="8" fill="url(#missGrad)" stroke="#f85149" stroke-width="2" stroke-dasharray="4"/>
  <text x="440" y="252" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">P-gp (ABCB1)</text>
  <text x="440" y="267" fill="#ffdcd7" font-size="10" text-anchor="middle">Renal Secretion (~33%)</text>

  <!-- BCRP (Neutral Edge) -->
  <rect x="360" y="320" width="160" height="55" rx="8" fill="url(#neutralGrad)" stroke="#bc8cff" stroke-width="2"/>
  <text x="440" y="352" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">BCRP (ABCG2)</text>
  <text x="440" y="367" fill="#f2e8ff" font-size="10" text-anchor="middle">Efflux Transporter (Neutral)</text>

  <!-- Substrate Drug: Rivaroxaban -->
  <rect x="680" y="170" width="170" height="60" rx="8" fill="url(#drugGrad)" stroke="#58a6ff" stroke-width="2"/>
  <text x="765" y="205" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">RIVAROXABAN</text>
  <text x="765" y="220" fill="#c9d1d9" font-size="10" text-anchor="middle">Substrate (Narrow Index)</text>

  <!-- Edges -->
  <!-- Ketoconazole -> CYP3A4 (Matched) -->
  <path d="M 210 215 L 350 155" stroke="#3fb950" stroke-width="3" fill="none" marker-end="url(#arrowMatch)"/>
  <text x="270" y="175" fill="#3fb950" font-size="11" font-weight="700" transform="rotate(-23 270 175)">INHIBITS ✅</text>

  <!-- Ketoconazole -> P-gp (Missed) -->
  <path d="M 210 235 L 350 245" stroke="#f85149" stroke-width="2.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowMiss)"/>
  <text x="270" y="235" fill="#f85149" font-size="11" font-weight="700">INHIBITS ❌</text>

  <!-- Ketoconazole -> BCRP (Neutral) -->
  <path d="M 210 255 L 350 335" stroke="#bc8cff" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrowNeutral)"/>
  <text x="265" y="315" fill="#bc8cff" font-size="10" font-weight="600" transform="rotate(27 265 315)">INHIBITS (Neutral)</text>

  <!-- CYP3A4 -> Rivaroxaban (Matched) -->
  <path d="M 520 155 L 670 190" stroke="#3fb950" stroke-width="3" fill="none" marker-end="url(#arrowMatch)"/>
  <text x="585" y="165" fill="#3fb950" font-size="11" font-weight="700">INCREASES AUC ✅</text>

  <!-- P-gp -> Rivaroxaban (Missed) -->
  <path d="M 520 245 L 670 210" stroke="#f85149" stroke-width="2.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowMiss)"/>
  <text x="560" y="240" fill="#f85149" font-size="11" font-weight="700">INCREASES AUC ❌</text>

  <!-- Callout Box: Fatal Trap Avoidance -->
  <rect x="50" y="405" width="800" height="55" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="70" y="428" fill="#e3b341" font-size="12" font-weight="700">⚠️ Model Reasoning Breakdown &amp; Fatal Safety Trap:</text>
  <text x="70" y="446" fill="#c9d1d9" font-size="11">Frontier model proposed: "Reduce Rivaroxaban to 10 mg". In CrCl 41 mL/min, dual inhibition collapses elimination &gt;2.6x AUC. Only absolute contraindication is safe.</text>
</svg>

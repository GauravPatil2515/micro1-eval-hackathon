<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="drugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="lethalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
    <linearGradient id="swapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <marker id="arrowLethal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
    <marker id="arrowSafe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="45" fill="#f0f6fc" font-size="20" font-weight="700">Case 2: Counterfactual Collapse / False All-Clear (TASK-03)</text>
  <text x="40" y="70" fill="#8b949e" font-size="13">Sotalol + HCTZ + Levofloxacin (K+ 3.1 mEq/L) — Residual Risk Invariant Failure</text>

  <!-- Condition A: Initial Regimen -->
  <rect x="40" y="95" width="400" height="280" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="60" y="125" fill="#f85149" font-size="15" font-weight="700">Triple Hit: Sotalol + Levofloxacin + Hypokalemia</text>
  
  <rect x="60" y="150" width="160" height="40" rx="6" fill="url(#drugGrad)"/>
  <text x="140" y="175" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Sotalol 80 mg BID</text>

  <rect x="60" y="210" width="160" height="40" rx="6" fill="url(#drugGrad)"/>
  <text x="140" y="235" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Levofloxacin 500 mg</text>

  <rect x="60" y="270" width="160" height="40" rx="6" fill="#6e40c9"/>
  <text x="140" y="295" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">HCTZ (K+ 3.1 mEq/L)</text>

  <!-- Lethal Outcome -->
  <rect x="270" y="190" width="150" height="70" rx="8" fill="url(#lethalGrad)"/>
  <text x="345" y="222" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">hERG BLOCKADE</text>
  <text x="345" y="242" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Torsades de Pointes</text>

  <path d="M 220 170 L 260 210" stroke="#f85149" stroke-width="2" marker-end="url(#arrowLethal)"/>
  <path d="M 220 230 L 260 230" stroke="#f85149" stroke-width="2" marker-end="url(#arrowLethal)"/>
  <path d="M 220 290 L 260 245" stroke="#f85149" stroke-width="2" marker-end="url(#arrowLethal)"/>

  <!-- Condition B: Counterfactual Swap -->
  <rect x="460" y="95" width="400" height="280" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="480" y="125" fill="#e3b341" font-size="15" font-weight="700">Counterfactual: Swap Levo → Doxycycline</text>

  <rect x="480" y="150" width="160" height="40" rx="6" fill="url(#drugGrad)"/>
  <text x="560" y="175" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Sotalol 80 mg BID</text>

  <rect x="480" y="210" width="160" height="40" rx="6" fill="url(#swapGrad)"/>
  <text x="560" y="235" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Doxycycline 100 mg</text>

  <rect x="480" y="270" width="160" height="40" rx="6" fill="#6e40c9"/>
  <text x="560" y="295" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">HCTZ (K+ 3.1 Uncorrected!)</text>

  <!-- Model False All-Clear vs Clinician Truth -->
  <rect x="680" y="145" width="160" height="50" rx="6" fill="#21262d" stroke="#f85149" stroke-width="2"/>
  <text x="760" y="167" fill="#f85149" font-size="11" font-weight="700" text-anchor="middle">LLM FALSE ALL-CLEAR:</text>
  <text x="760" y="184" fill="#ffdcd7" font-size="10" text-anchor="middle">residual_risk_remains = False</text>

  <rect x="680" y="235" width="160" height="60" rx="6" fill="url(#lethalGrad)" stroke="#f85149" stroke-width="2"/>
  <text x="760" y="260" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">CLINICAL TRUTH:</text>
  <text x="760" y="278" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">LETHAL TdP RISK PERSISTS</text>

  <!-- Banner Summary -->
  <rect x="40" y="395" width="820" height="85" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="60" y="423" fill="#f85149" font-size="14" font-weight="800">🚨 THE CLINICAL REASONING DEFICIT: COUNTERFACTUAL COLLAPSE</text>
  <text x="60" y="445" fill="#c9d1d9" font-size="12">Frontier models accurately identify that Doxycycline resolves the antimicrobial hERG block, but reflexively issue a false all-clear.</text>
  <text x="60" y="465" fill="#c9d1d9" font-size="12">They fail to recognize that uncorrected hypokalemia (< 4.0 mEq/L) independently destabilizes repolarization in the presence of Sotalol.</text>
</svg>

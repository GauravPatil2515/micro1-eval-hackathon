<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="drugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="cyp2c9Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="cyp3a4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="potentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
    <marker id="arrowMatch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowMiss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
    <marker id="arrowNeutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bc8cff"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="45" fill="#f0f6fc" font-size="20" font-weight="700">Case 3: Stereoselective Enantiomeric Clearance Blindness (TASK-07)</text>
  <text x="40" y="70" fill="#8b949e" font-size="13">Warfarin + Metronidazole — Models Conflate 5x Potent S-Warfarin with Weak R-Warfarin</text>

  <!-- Offending Agent -->
  <rect x="50" y="190" width="180" height="60" rx="8" fill="url(#drugGrad)" stroke="#58a6ff" stroke-width="2"/>
  <text x="140" y="222" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">METRONIDAZOLE</text>
  <text x="140" y="240" fill="#c9d1d9" font-size="10" text-anchor="middle">Stereoselective Inhibitor</text>

  <!-- Enzymes -->
  <rect x="360" y="130" width="170" height="55" rx="8" fill="url(#cyp2c9Grad)" stroke="#3fb950" stroke-width="2"/>
  <text x="445" y="162" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">CYP2C9</text>
  <text x="445" y="177" fill="#dcffe4" font-size="10" text-anchor="middle">Major Clearance (~85%)</text>

  <rect x="360" y="250" width="170" height="55" rx="8" fill="url(#cyp3a4Grad)" stroke="#bc8cff" stroke-width="2"/>
  <text x="445" y="282" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">CYP3A4 / CYP1A2</text>
  <text x="445" y="297" fill="#f2e8ff" font-size="10" text-anchor="middle">Minor Pathway (Neutral)</text>

  <!-- Enantiomers -->
  <rect x="670" y="125" width="190" height="65" rx="8" fill="url(#potentGrad)" stroke="#f85149" stroke-width="2"/>
  <text x="765" y="155" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">S-WARFARIN</text>
  <text x="765" y="172" fill="#ffdcd7" font-size="10" font-weight="700" text-anchor="middle">3x-5x More Potent Anticoagulant</text>

  <rect x="670" y="245" width="190" height="65" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="765" y="275" fill="#c9d1d9" font-size="14" font-weight="700" text-anchor="middle">R-WARFARIN</text>
  <text x="765" y="292" fill="#8b949e" font-size="10" text-anchor="middle">Weak Inactive Enantiomer</text>

  <!-- Directed Edges -->
  <path d="M 230 205 L 350 165" stroke="#3fb950" stroke-width="3" fill="none" marker-end="url(#arrowMatch)"/>
  <text x="250" y="170" fill="#3fb950" font-size="10" font-weight="700">STEREOSELECTIVELY INHIBITS</text>

  <path d="M 230 230 L 350 270" stroke="#bc8cff" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrowNeutral)"/>
  <text x="260" y="260" fill="#bc8cff" font-size="10" font-weight="600">INHIBITS (Neutral)</text>

  <path d="M 530 157 L 660 157" stroke="#3fb950" stroke-width="3" fill="none" marker-end="url(#arrowMatch)"/>
  <text x="545" y="148" fill="#3fb950" font-size="10" font-weight="700">INCREASES EXPOSURE ✅</text>

  <path d="M 530 277 L 660 277" stroke="#bc8cff" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrowNeutral)"/>
  <text x="545" y="268" fill="#bc8cff" font-size="10">INCREASES EXPOSURE (Neutral)</text>

  <!-- Summary Callout -->
  <rect x="40" y="360" width="820" height="95" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="60" y="388" fill="#e3b341" font-size="13" font-weight="700">⚠️ Why Frontier Models Fail Stereoselective Invariance:</text>
  <text x="60" y="410" fill="#c9d1d9" font-size="11">Standard LLM responses emit generic edges like "Metronidazole -> INHIBITS -> CYP3A4" or treat racemic warfarin as a single entity.</text>
  <text x="60" y="428" fill="#c9d1d9" font-size="11">They miss that Metronidazole selectively inhibits CYP2C9, which exclusively clears the S-enantiomer, causing acute supratherapeutic INR surge and life-threatening bleeding.</text>
</svg>
